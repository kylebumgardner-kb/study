<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Terrier study mark">
  <!-- Original decorative terrier drawn for this study page.
       Uses Wofford's Old Gold #8A6E4B / Black #282829. This is NOT the
       college's registered Terrier Head mark and is not a substitute for it. -->
  <circle cx="32" cy="32" r="31" fill="#282829" stroke="#8A6E4B" stroke-width="2"/>
  <g fill="#8A6E4B">
    <!-- folded ears, set wide and tipped forward -->
    <path d="M18.5 26.5 L14 13.5 L26 20 Z"/>
    <path d="M45.5 26.5 L50 13.5 L38 20 Z"/>
    <!-- head: broad skull tapering to a beard -->
    <path d="M32 18.5c8.8 0 14.6 4.8 14.6 12.1 0 3.6-.8 6.4-2.2 8.6-.8 1.3-1.2 2.2-1.4 3.6l-.5 3.6c-.3 2.2-2.2 3.9-4.5 3.9H26c-2.3 0-4.2-1.7-4.5-3.9l-.5-3.6c-.2-1.4-.6-2.3-1.4-3.6-1.4-2.2-2.2-5-2.2-8.6 0-7.3 5.8-12.1 14.6-12.1z"/>
    <!-- scruffy beard tufts -->
    <path d="M25 47.5l-1.6 4.3 3.4-2.1zM39 47.5l1.6 4.3-3.4-2.1z"/>
  </g>
  <!-- muzzle / snout -->
  <path d="M26 37.5h12c.8 0 1.4.7 1.3 1.5l-.8 5c-.3 1.7-1.7 2.9-3.4 2.9h-6.2c-1.7 0-3.1-1.2-3.4-2.9l-.8-5c-.1-.8.5-1.5 1.3-1.5z" fill="#E9E6E1"/>
  <!-- brows -->
  <g fill="#E9E6E1" opacity=".55">
    <path d="M22.5 26.5l6 1.4-5.8.8z"/>
    <path d="M41.5 26.5l-6 1.4 5.8.8z"/>
  </g>
  <!-- eyes -->
  <circle cx="25.8" cy="31.2" r="2.7" fill="#282829"/>
  <circle cx="38.2" cy="31.2" r="2.7" fill="#282829"/>
  <circle cx="26.6" cy="30.3" r=".9" fill="#E9E6E1"/>
  <circle cx="39" cy="30.3" r=".9" fill="#E9E6E1"/>
  <!-- nose + mouth -->
  <path d="M32 38.2c1.9 0 3.1.9 3.1 2s-1.4 2.1-3.1 2.1-3.1-1-3.1-2.1.9-2 3.1-2z" fill="#282829"/>
  <path d="M32 42.3v2.2M32 44.5c-1.1 0-2 .6-2.4 1.4M32 44.5c1.1 0 2 .6 2.4 1.4"
        stroke="#282829" stroke-width="1.1" fill="none" stroke-linecap="round"/>
</svg>
