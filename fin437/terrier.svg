<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Terrier study mark">
  <!-- Original decorative terrier silhouette drawn for this study page.
       Uses Wofford's Old Gold #8A6E4B / Black #282829. This is NOT the
       college's registered Terrier Head mark and is not a substitute for it. -->
  <circle cx="32" cy="32" r="31" fill="#282829" stroke="#8A6E4B" stroke-width="2"/>
  <g fill="#8A6E4B">
    <!-- ears -->
    <path d="M20 22 L17.5 11 L27 17.5 Z"/>
    <path d="M44 22 L46.5 11 L37 17.5 Z"/>
    <!-- head -->
    <path d="M32 17c8.6 0 14.2 5.1 14.2 12.4 0 4.2-1.1 7.3-2.9 9.7-.9 1.2-1.3 2.1-1.5 3.6l-.6 5.1c-.1 1.2-1.1 2.1-2.3 2.1H25.1c-1.2 0-2.2-.9-2.3-2.1l-.6-5.1c-.2-1.5-.6-2.4-1.5-3.6-1.8-2.4-2.9-5.5-2.9-9.7C17.8 22.1 23.4 17 32 17z"/>
  </g>
  <!-- muzzle -->
  <path d="M26.5 38.5h11c.7 0 1.2.6 1.1 1.3l-.7 4.4c-.2 1.4-1.4 2.4-2.8 2.4h-6.2c-1.4 0-2.6-1-2.8-2.4l-.7-4.4c-.1-.7.4-1.3 1.1-1.3z" fill="#E9E6E1"/>
  <!-- eyes -->
  <circle cx="26" cy="31" r="2.5" fill="#282829"/>
  <circle cx="38" cy="31" r="2.5" fill="#282829"/>
  <!-- nose -->
  <ellipse cx="32" cy="40.5" rx="2.6" ry="2" fill="#282829"/>
</svg>
